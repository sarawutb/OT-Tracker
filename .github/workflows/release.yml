name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      PROJECT: src/OTTracker/OTTracker.csproj
      TFM: net10.0-android36.1
      APK_NAME: com.company.ottracker-Signed.apk

    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION=$(grep -oP '(?<=<ApplicationDisplayVersion>)[^<]+' "$PROJECT")
          JSON_VERSION=$(jq -r '.versionName' update.json)
          echo "tag=$TAG_VERSION csproj=$CSPROJ_VERSION update.json=$JSON_VERSION"
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ] || [ "$TAG_VERSION" != "$JSON_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match ApplicationDisplayVersion ($CSPROJ_VERSION) and update.json versionName ($JSON_VERSION)"
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          dotnet publish "$PROJECT" -f "$TFM" -c Release -o out \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningKeyPass="$ANDROID_KEY_PASSWORD" \
            -p:AndroidSigningStorePass="$ANDROID_STORE_PASSWORD"
          ls -la out/*.apk
          test -f "out/$APK_NAME"

      - name: Release notes from update.json
        run: jq -r '.changeLog' update.json > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: out/${{ env.APK_NAME }}
